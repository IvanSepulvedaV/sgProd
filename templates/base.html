{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SG-Prod{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/theme.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <nav class="sg-nav" aria-label="Principal">
    <span class="sg-logo">SG<b>-Prod</b></span>
    <a href="{% url 'asignacion' %}" {% if request.resolver_match.url_name == 'asignacion' %}aria-current="page"{% endif %}>Asignación</a>
    <a href="{% url 'captura' %}" {% if request.resolver_match.url_name == 'captura' %}aria-current="page"{% endif %}>Captura de calidad</a>
    <a href="{% url 'dashboard' %}" {% if request.resolver_match.url_name == 'dashboard' %}aria-current="page"{% endif %}>Dashboard</a>
  </nav>
  <main class="sg-main">
    {% if messages %}{% for m in messages %}<div class="sg-card" role="status">{{ m }}</div>{% endfor %}{% endif %}
    {% block content %}{% endblock %}
  </main>
  {% block extra_js %}{% endblock %}
</body>
</html>
